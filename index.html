
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DH BILLIARDS - Mục 1</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d12;font-family:Arial,sans-serif}
#game{width:100%;height:100%;display:block;touch-action:none}
#brand{position:absolute;top:18px;left:20px;color:#e8c77d;font-weight:bold;letter-spacing:4px;font-size:19px;text-shadow:0 2px 8px #000}
#info{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#f3dfb0;background:#10151ddd;border:1px solid #b58b45;border-radius:25px;padding:12px 20px;font-size:12px;white-space:nowrap}
#status{position:absolute;top:55px;left:20px;color:#ddd;font-size:12px}
</style>
</head>
<body>
<div id="brand">♛ DH BILLIARDS</div>
<div id="status">MỤC 1 · BÀN BI-A 3D</div>
<div id="info">Kéo để xoay bàn · Chụm hai ngón để phóng to</div>
<canvas id="game"></canvas>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const canvas=document.querySelector('#game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080d13);

const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);
camera.position.set(3.5,3.4,4.8);

const renderer=new THREE.WebGLRenderer({
 canvas,antialias:true,alpha:false
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

scene.add(new THREE.HemisphereLight(0xffffff,0x29303a,2));

const light=new THREE.DirectionalLight(0xffedcf,3);
light.position.set(-3,7,4);
light.castShadow=true;
light.shadow.mapSize.set(2048,2048);
scene.add(light);

const fill=new THREE.PointLight(0x8ebaff,35,12);
fill.position.set(2,3,-3);
scene.add(fill);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.055;
controls.minDistance=2.5;
controls.maxDistance=9;
controls.maxPolarAngle=Math.PI*.48;
controls.target.set(0,.65,0);
controls.update();

const table=new THREE.Group();
scene.add(table);

function box(parent,w,h,d,x,y,z,material){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),material
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

const wood=new THREE.MeshStandardMaterial({
 color:0x492515,roughness:.3,metalness:.15
});
const woodTop=new THREE.MeshStandardMaterial({
 color:0x80502b,roughness:.3
});
const cloth=new THREE.MeshStandardMaterial({
 color:0x087044,roughness:.9
});
const rubber=new THREE.MeshStandardMaterial({
 color:0x123c2d,roughness:.75
});
const gold=new THREE.MeshStandardMaterial({
 color:0xc29b50,metalness:.75,roughness:.25
});
const black=new THREE.MeshStandardMaterial({
 color:0x08090b,roughness:.3
});

// Khung bàn
const L=2.54,W=1.27;
const topY=.82;
const rail=.15;

box(table,L+.32,.18,W+.32,0,.58,0,wood);
box(table,L+.19,.055,W+.19,0,.69,0,woodTop);

// Mặt nỉ xanh
box(table,L,.035,W,0,topY,0,cloth);

// Sáu đoạn băng, chừa khoảng trống cho sáu lỗ
const end=L/2;
const half=W/2;
const gap=.115;
const endInset=.13;

for(const z of [-1,1]){
 const zz=z*(half+rail/2);
 box(table,end-gap-endInset,.13,rail,
  (-end+endInset-gap)/2,topY+.08,zz,rubber);
 box(table,end-gap-endInset,.13,rail,
  (end-endInset+gap)/2,topY+.08,zz,rubber);
}
for(const x of [-1,1]){
 const xx=x*(end+rail/2);
 box(table,rail,.13,half-gap-endInset,
  xx,topY+.08,(-half+endInset-gap)/2,rubber);
 box(table,rail,.13,half-gap-endInset,
  xx,topY+.08,(half-endInset+gap)/2,rubber);
}

// Viền gỗ ngoài
box(table,L+.32,.07,.055,0,.72,-(half+rail),gold);
box(table,L+.32,.07,.055,0,.72,(half+rail),gold);
box(table,.055,.07,W+.32,-(end+rail),.72,0,gold);
box(table,.055,.07,W+.32,(end+rail),.72,0,gold);

// Sáu lỗ
const pocketMaterial=new THREE.MeshStandardMaterial({
 color:0x020304,roughness:1
});
function pocket(x,z,r){
 const p=new THREE.Mesh(
  new THREE.CylinderGeometry(r,r,.025,48),pocketMaterial
 );
 p.position.set(x,topY+.025,z);
 table.add(p);
 const rim=new THREE.Mesh(
  new THREE.TorusGeometry(r,.012,10,48),gold
 );
 rim.rotation.x=Math.PI/2;
 rim.position.set(x,topY+.035,z);
 table.add(rim);
}
pocket(-end,-half,.095);
pocket(0,-half,.083);
pocket(end,-half,.095);
pocket(-end,half,.095);
pocket(0,half,.083);
pocket(end,half,.095);

// Chân bàn
for(const x of [-1,1]){
 for(const z of [-1,1]){
  box(table,.17,.62,.17,x*1.12,.28,z*.49,wood);
  box(table,.22,.06,.22,x*1.12,.035,z*.49,gold);
 }
}

// Bóng bi-a có số
const colors=[
 0xffffff,0xffd522,0x1757c9,0xe52b26,
 0x7629a8,0xff7b16,0x16804b,0x761c26,
 0x171717,0xffd522,0x1757c9,0xe52b26,
 0x7629a8,0xff7b16,0x16804b,0x761c26
];

function makeBallTexture(n,color){
 const c=document.createElement('canvas');
 c.width=256;c.height=256;
 const ctx=c.getContext('2d');
 ctx.fillStyle='#ffffff';
 ctx.fillRect(0,0,256,256);

 ctx.fillStyle='#ffffff';
 ctx.beginPath();
 ctx.arc(128,128,124,0,Math.PI*2);
 ctx.fill();

 if(n===0){
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,256,256);
 }else if(n!==1 && n!==8){
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,256,256);
  ctx.fillStyle='#'+color.toString(16).padStart(6,'0');
  ctx.fillRect(0,66,256,124);
 }

 ctx.fillStyle='#fff';
 ctx.beginPath();
 ctx.arc(128,128,49,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle='#111';
 ctx.font='bold 56px Arial';
 ctx.textAlign='center';
 ctx.textBaseline='middle';
 ctx.fillText(n===0?'':String(n),128,130);

 const t=new THREE.CanvasTexture(c);
 t.colorSpace=THREE.SRGBColorSpace;
 return t;
}

const ballGeo=new THREE.SphereGeometry(.029,48,32);
const balls=new THREE.Group();
table.add(balls);

function addBall(n,x,z){
 const color=colors[n];
 const texture=makeBallTexture(n,color);
 const material=new THREE.MeshPhysicalMaterial({
  color:0xffffff,
  map:texture,
  roughness:.17,
  metalness:0,
  clearcoat:1,
  clearcoatRoughness:.08
 });
 const ball=new THREE.Mesh(ballGeo,material);
 ball.position.set(x,topY+.065,z);
 ball.castShadow=true;
 ball.receiveShadow=true;
 balls.add(ball);
}

const spacing=.066;
const rows=[
 [0],
 [-1,1],
 [-2,0,2],
 [-3,-1,1,3],
 [-4,-2,0,2,4]
];
let number=1;
for(let r=0;r<5;r++){
 for(const k of rows[r]){
  const n=(r===2&&k===0)?8:number;
  if(n===8)number++;
  addBall(n,
   .63-r*.058,
   k*spacing
  );
  if(n!==8)number++;
 }
}
addBall(0,-.65,0);

// Sàn nền
const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({
  color:0x101820,roughness:.85
 })
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.045;
floor.receiveShadow=true;
scene.add(floor);

// Viền logo nhỏ trên mặt bàn
const logo=new THREE.Mesh(
 new THREE.BoxGeometry(.28,.002,.025),
 gold
);
logo.position.set(0,topY+.019,0);
table.add(logo);

// Chuyển động
function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();

function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
}
window.addEventListener('resize',resize);
</script>
</body>
</html>
