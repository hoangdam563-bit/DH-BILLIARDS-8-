<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DH BILLIARDS - Mã 1</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b16}
#game{width:100%;height:100%;display:block;touch-action:none}
#brand{position:fixed;top:14px;width:100%;text-align:center;color:#e8c66b;font:bold 22px Arial;letter-spacing:5px;text-shadow:0 0 12px #d4a83d}
#info{position:fixed;bottom:12px;width:100%;text-align:center;color:#e8c66b;font:12px Arial}
</style>
</head>
<body>
<div id="brand">♛ DH BILLIARDS</div>
<div id="info">MỤC 1 · BÀN BI-A 3D · KÉO ĐỂ XOAY GÓC NHÌN</div>
<canvas id="game"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050b16);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);
camera.position.set(7,7,9);

const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#game'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,.4,0);
controls.enableDamping=true;
controls.minDistance=5;
controls.maxDistance=16;
controls.maxPolarAngle=Math.PI/2.05;

scene.add(new THREE.HemisphereLight(0xffffff,0x263044,2));
const lamp=new THREE.DirectionalLight(0xffe2a0,3);
lamp.position.set(-4,9,5);
lamp.castShadow=true;
scene.add(lamp);

const mat=(color,metalness=0,roughness=.5)=>new THREE.MeshStandardMaterial({color,metalness,roughness});
const wood=mat(0x21150e,.55,.3);
const gold=mat(0xd2a344,.8,.22);
const felt=mat(0x07529a,0,.85);
const hole=mat(0x020306,0,.9);

function block(w,h,d,material,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}

// Chân bàn
for(const x of [-2.65,2.65])for(const z of [-1.4,1.4]){
 block(.28,1.1,.28,wood,x,-.55,z);
 block(.38,.1,.38,gold,x,-1.12,z);
}

// Khung và mặt bàn
block(6.5,.38,3.7,wood,0,0,0);
block(6.2,.09,3.4,gold,0,.23,0);
block(5.95,.07,3.15,felt,0,.31,0);

// Thành băng
block(6.2,.27,.22,wood,0,.48,-1.62);
block(6.2,.27,.22,wood,0,.48,1.62);
block(.22,.27,3.15,wood,-3.0,.48,0);
block(.22,.27,3.15,wood,3.0,.48,0);

// Viền vàng
block(6.2,.045,.23,gold,0,.64,-1.62);
block(6.2,.045,.23,gold,0,.64,1.62);
block(.23,.045,3.15,gold,-3,.64,0);
block(.23,.045,3.15,gold,3,.64,0);

// Sáu lỗ bàn
function makePocket(x,z){
 const p=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.025,32),hole);
 p.position.set(x,.36,z);scene.add(p);
 const r=new THREE.Mesh(new THREE.TorusGeometry(.18,.025,10,32),gold);
 r.rotation.x=Math.PI/2;r.position.set(x,.39,z);scene.add(r);
}
for(const x of [-3,0,3])for(const z of [-1.62,1.62])makePocket(x,z);

// Bi số
const colors=[0xffff00,0x1767dc,0xe32626,0x8526a5,0xff7900,0x168c49,0x8b1728,0x111111,
0xffff00,0x1767dc,0xe32626,0x8526a5,0xff7900,0x168c49,0x8b1728];

function makeBall(x,z,color,num,stripe=false){
 const group=new THREE.Group();
 const sphere=new THREE.Mesh(
  new THREE.SphereGeometry(.115,32,24),
  mat(stripe?0xffffff:color,0,.16)
 );
 sphere.position.y=.115;sphere.castShadow=true;group.add(sphere);

 if(stripe){
  const band=new THREE.Mesh(new THREE.TorusGeometry(.115,.025,10,32),mat(color));
  band.position.y=.115;band.rotation.x=Math.PI/2;group.add(band);
 }
 if(num){
  const c=document.createElement('canvas');c.width=128;c.height=128;
  const ctx=c.getContext('2d');
  ctx.fillStyle='white';ctx.beginPath();ctx.arc(64,64,60,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.font='bold 70px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(num,64,66);
  const texture=new THREE.CanvasTexture(c);
  const label=new THREE.Mesh(new THREE.CircleGeometry(.04,32),new THREE.MeshBasicMaterial({map:texture}));
  label.position.set(0,.218,0);label.rotation.x=-Math.PI/2;group.add(label);
 }
 group.position.set(x,.38,z);scene.add(group);
}
makeBall(-1.8,0,0xffffff,'');
let n=0;
for(let row=0;row<5;row++){
 for(let col=0;col<=row;col++){
  makeBall(1.2+row*.23,(col-row/2)*.24,colors[n],String(n+1),n>=8);
  n++;
 }
}

// Sàn
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),mat(0x080f1b,0,.9));
floor.rotation.x=-Math.PI/2;floor.position.y=-1.12;floor.receiveShadow=true;scene.add(floor);

// Cơ bi-a trang trí
const cue=new THREE.Mesh(new THREE.CylinderGeometry(.018,.035,3.1,16),mat(0xc18b42,.55,.3));
cue.rotation.z=Math.PI/2;cue.position.set(-1.8,.48,0);scene.add(cue);

function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);
function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
